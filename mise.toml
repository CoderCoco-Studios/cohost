# The project's toolchains and commands (deployment design, "Toolchains and commands"; HLD Tenet 14).
# Every command a person or CI runs is a task here: `mise run <task>`. Dependency edits are the one
# exception: `pnpm add`/`pnpm remove` and `cargo add`/`cargo remove`, run directly.
# @spec DEPLOY-TOOL-001, DEPLOY-TOOL-003, DEPLOY-TOOL-005, DEPLOY-TOOL-009

# The mise release the installer, the Dockerfile and CI install (DEPLOY-TOOL-002 holds them to it).
min_version = "2026.11.14"

[settings]
# mise.lock records each tool's resolved version, URL and checksum; every install is `mise install --locked`.
lockfile = true
# pnpm's version is package.json "packageManager"; Rust's toolchain is rust-toolchain.toml. Neither is written here.
idiomatic_version_file_enable_tools = ["pnpm", "rust"]

[settings.rust]
# The project's Rust never installs into or changes the operator's own ~/.rustup and ~/.cargo.
rustup_home = "~/.local/share/mise/rustup"
cargo_home = "~/.local/share/mise/cargo"

[tools]
node = "26.13.1"
zig = "0.17.1"
python = "3.15.2"
watchexec = "2.8.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Every x86_64-unknown-linux-gnu link and C/C++ compile goes through Zig (deployment "Linking through Zig").
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/scripts/zig-cc"
CC_x86_64_unknown_linux_gnu = "{{config_root}}/scripts/zig-cc"
CXX_x86_64_unknown_linux_gnu = "{{config_root}}/scripts/zig-cxx"
AR_x86_64_unknown_linux_gnu = "{{config_root}}/scripts/zig-ar"
# rustc's self-contained lld flags would reach the wrapper; turn them off.
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-Clinker-features=-lld"
ZIG_GLOBAL_CACHE_DIR = "{{env.HOME}}/.local/share/mise/zig-cache/global"
ZIG_LOCAL_CACHE_DIR = "{{env.HOME}}/.local/share/mise/zig-cache/local"
# The glibc the addon links against: the supported host floor (Ubuntu 22.04), not newer than Debian 13's 2.41.
ZIG_GLIBC = "2.35"

# ------------------------------------------------------------------------------------------ install and build

[tasks.install]
description = "Install the workspace's dependencies from pnpm-lock.yaml (frozen)"
# pnpm leaves .modules.yaml untouched when nothing needs installing; the touch marks the install current
# so the task (and every task after it) is skipped until a manifest or the lockfile changes again.
run = ["pnpm install --frozen-lockfile", "touch node_modules/.modules.yaml"]
sources = ["pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "packages/*/package.json", "services/*/package.json"]
outputs = ["node_modules/.modules.yaml"]

[tasks."build:native"]
description = "Build the bus addon (crates/cohost-bus-node) into packages/bus/native/"
run = [
  "cargo build --release -p cohost-bus-node",
  "mkdir -p packages/bus/native",
  "cp target/release/libcohost_bus_node.so packages/bus/native/cohost-bus.linux-x64-gnu.node",
]
sources = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**"]
outputs = ["packages/bus/native/cohost-bus.linux-x64-gnu.node"]

[tasks."build:ts"]
description = "Compile every package and service (tsc -b, incremental)"
depends = ["install"]
run = "tsc -b"

[tasks."build:ui"]
description = "Build the dashboard's web UI into services/dashboard/dist-ui/"
# ui/src/avatar/pose.ts imports @cohost/shared/head-rotation, which resolves to packages/shared/dist/; a change to
# the shared package's sources rebuilds the bundle.
depends = ["build:ts"]
dir = "{{config_root}}/services/dashboard"
run = "node_modules/.bin/vite build --config ui/vite.config.ts"
sources = ["{{config_root}}/services/dashboard/ui/**", "{{config_root}}/packages/shared/src/**"]
outputs = ["{{config_root}}/services/dashboard/dist-ui/index.html"]

[tasks.build]
description = "Build everything: the bus addon, the TypeScript workspace and the dashboard UI"
depends = ["build:native", "build:ts", "build:ui"]

[tasks.clean]
description = "Remove the TypeScript build output"
run = "rm -rf packages/*/dist services/*/dist services/dashboard/dist-ui"

# ------------------------------------------------------------------------------------------ lint and test

[tasks.typecheck]
description = "Type-check the workspace, the dashboard UI and the tests"
depends = ["install"]
run = ["tsc -b", "tsc -p services/dashboard/ui --noEmit", "scripts/typecheck-tests.sh"]

[tasks."lint:ts"]
description = "Lint TypeScript (oxlint, type-aware, rules in .oxlintrc.json) after the type check"
depends = ["typecheck"]
run = "oxlint --type-aware --deny-warnings"

[tasks."lint:rust"]
description = "Check Rust formatting and run Clippy with warnings denied"
run = ["cargo fmt --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.lint]
description = "Lint TypeScript and Rust"
depends = ["lint:ts", "lint:rust"]

[tasks."test:rust"]
description = "Run the Rust tests and check the desktop audio helper's Windows back end"
run = ["cargo test --workspace", "cargo check --target x86_64-pc-windows-msvc -p cohost-desktop-audio"]

# The test tasks run through scripts/test-env.sh: a temporary COHOST_DATA_DIR and CONFIG_DIR (copies of the examples), with
# COHOST_ENV_FILE and COHOST_SECRETS_FILE inside it, removed when the run ends (DEPLOY-TOOL-022).
[tasks.test]
description = "Run every test: Rust, then the build, then the TypeScript suite"
depends = ["build", "test:rust"]
env = { TSX_TSCONFIG_PATH = "tsconfig.test.json" }
run = 'scripts/test-env.sh node --import tsx --test "packages/*/test/*.test.ts" "services/*/test/*.test.ts" "services/*/test/ui/*.test.tsx"'

[tasks."test:only"]
description = "Run the TypeScript suite with no build first"
env = { TSX_TSCONFIG_PATH = "tsconfig.test.json" }
run = 'scripts/test-env.sh node --import tsx --test "packages/*/test/*.test.ts" "services/*/test/*.test.ts" "services/*/test/ui/*.test.tsx"'

[tasks."test:file"]
description = "Run the given test files (arguments after the task name) after the build"
depends = ["build"]
env = { TSX_TSCONFIG_PATH = "tsconfig.test.json" }
run = "scripts/test-env.sh node --import tsx --test"

[tasks."test:launch"]
description = "Run the launch end-to-end test against Docker"
depends = ["build", "doctor:docker"]
run = "scripts/test-env.sh node --import tsx --test packages/control/test/launch.e2e.test.ts"

[tasks."test:rust-example"]
description = "Run the Rust bus example's round trip; fails when it skips"
shell = "bash -c"
run = '''
set -o pipefail
log="$(mktemp)"
cargo test --manifest-path examples/Cargo.toml -p cohost-example-bus -- --nocapture 2>&1 | tee "$log" || exit 1
if grep -q '^SKIP ' "$log"; then echo "test:rust-example: the round trip was skipped" >&2; exit 1; fi
grep -q '^RAN round_trip against ' "$log" || { echo "test:rust-example: no 'RAN round_trip against' line" >&2; exit 1; }
'''

[tasks.lid-check]
description = "Check the linked-intent spec citations"
run = "node scripts/lid-check.mjs"

# @spec DEPLOY-CI-005
[tasks.cla]
description = "Check a pull request's CLA signatures (run by the cla workflow; needs its event and GITHUB_TOKEN)"
run = "node scripts/cla/cla.mjs"

[tasks.smoke]
description = "Build and start a few services in Compose and wait for them to be healthy"
depends = ["doctor:docker"]
run = "scripts/compose-smoke.sh"

# ------------------------------------------------------------------------------------------ run on the host

[tasks.dashboard]
description = "Build and start the dashboard on this machine (it brings up the stack)"
depends = ["build:native", "build:ui"]
run = [
  "mise run docs:build || echo 'mise run dashboard: the docs build failed (see above); starting the dashboard anyway' >&2",
  "tsc -b services/dashboard",
  "node services/dashboard/dist/index.js",
]

[tasks."dashboard:unlock"]
description = "Print a fresh unlock link for the running dashboard (asks it with CONTROL_TOKEN from .env)"
depends = ["build:native"]
run = ["tsc -b services/dashboard", "node services/dashboard/dist/unlock-link.js"]

[tasks."dashboard:ui"]
description = "Run the dashboard UI's Vite dev server"
# The UI imports @cohost/shared's dist/, and the dev server's proxy loads @cohost/config's dist/.
depends = ["build:ts"]
dir = "{{config_root}}/services/dashboard"
run = "node_modules/.bin/vite --config ui/vite.config.ts"

[tasks.cohostctl]
description = "Run the cohostctl CLI (arguments after the task name)"
depends = ["build:native", "install"]
run = ["tsc -b packages/control", "node packages/control/dist/cli.js"]

[tasks."secrets:project"]
description = "Project secrets/secrets.yaml into each unit's secrets directory"
depends = ["install"]
run = ["tsc -b packages/control", "node packages/control/dist/project-secrets.js"]

[tasks.reflect]
description = "Run the memory reflection pass once"
depends = ["build:native", "build:ts"]
dir = "{{config_root}}/services/memory"
run = "node dist/reflect.js"

[tasks.consolidate]
description = "Run one memory consolidation pass"
depends = ["build:native", "build:ts"]
dir = "{{config_root}}/services/memory"
run = "node dist/consolidate.js"

[tasks.reembed]
description = "Re-embed the memory store with the configured embedder"
depends = ["build:native", "build:ts"]
dir = "{{config_root}}/services/memory"
run = "node dist/reembed.js"

[tasks."infra:up"]
description = "Start the infrastructure containers for the Docker-free dev loop"
depends = ["doctor:docker"]
run = "docker compose up -d redis postgres ollama tts stt"

[tasks."infra:down"]
description = "Stop the infrastructure containers"
depends = ["doctor:docker"]
run = "docker compose stop redis postgres ollama tts stt"

# ------------------------------------------------------------------------------------------ dev loop
# One task per directory under services/ except dashboard. `outputs = []`: a clean exit never marks a
# service up to date. `mise watch --restart dev:<service>` rebuilds what changed and restarts it.
# Each runs the secrets projection first and reads its own unit's projection, as a container would, with CONTROL_TOKEN
# pinned empty (loading .env does not override a set variable), so no host-run service sees the token.
# @spec DEPLOY-TOOL-014

[tasks."dev:affect"]
description = "Run the affect service (use with mise watch --restart)"
depends = ["build:native", "build:ts", "secrets:project"]
dir = "{{config_root}}/services/affect"
env = { CONTROL_TOKEN = "", COHOST_SECRETS_FILE = "{{config_root}}/secrets/units/affect/secrets.yaml" }
run = "node dist/index.js"
sources = ["{{config_root}}/services/affect/src/**", "{{config_root}}/packages/*/src/**"]
outputs = []

[tasks."dev:avatar"]
description = "Run the avatar service (use with mise watch --restart)"
depends = ["build:native", "build:ts", "secrets:project"]
dir = "{{config_root}}/services/avatar"
