# Base stack. CPU-only by default; GPU is layered on via docker-compose.gpu.yml
# (install.sh writes COMPOSE_FILE into .env so plain `docker compose up` picks both).
#
#   The dashboard is not a Compose service: it runs on the host (`pnpm dashboard`) and its Launch button
#   runs `docker compose up -d` for the stack. By hand:
#   docker compose up -d                 # everything
#   docker compose up -d --build         # everything, rebuilding the service images first (cohostctl rebuild)
#   docker compose up -d chat salience affect memory cortex voice avatar   # minimal talking path
#   docker compose --profile ears up -d  # add the listener (reads what connectors publish)
#   docker compose --profile mouth up -d # add the speaker (writes her voice to the sinks)
#   docker compose --profile discord up -d # add the Discord connector (the one bot login: source and sink `discord`)
#   docker compose --profile eyes up -d  # add OBS vision
#   docker compose run --rm consolidate  # one-shot viewer-note pass (profile maintenance; best-effort, see below)
#   docker compose run --rm reembed      # one-shot vector migration after changing the embedder (memory stopped first)

# The settings every application service gets, whatever its environment: the restart policy, the host gateway, the bus
# dependency and the container healthcheck. A service that must hold less (tools, DEPLOY-COMPOSE-026) takes this block
# alone and states its own environment.
x-ts-service-base: &ts-base  # @spec DEPLOY-COMPOSE-026
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach OBS / VTube Studio on the host (Linux)
  depends_on:
    redis:
      condition: service_healthy
  # Healthy = the newest heartbeat on cohost:health is younger than 3x its interval and not
  # "stopping". $SERVICE is baked into the image (see Dockerfile). Applies to every app service.
  healthcheck:  # @spec DEPLOY-HC-001
    test: ["CMD-SHELL", "node packages/control/dist/healthcheck.js $$SERVICE"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s

x-ts-service: &ts-service  # @spec DEPLOY-COMPOSE-002, DEPLOY-COMPOSE-015, DEPLOY-COMPOSE-024
  <<: *ts-base
  env_file: .env
  # The environment every application service gets: the in-network addresses, and the one pass-through for an isolated
  # start. Operator settings live in config/config.yaml and credentials in config/secrets.yaml (the ./config mount below);
  # nothing else is interpolated here, and .env adds only the bootstrap variables of the HLD's "what lives where" table.
  environment:  # @spec DEPLOY-COMPOSE-003
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://cohost:cohost@postgres:5432/cohost
    OLLAMA_URL: http://ollama:11434
    TTS_URL: http://tts:8880
    STT_URL: http://stt:8000
    VOICE_URL: http://voice:8700
    CONFIG_DIR: /app/config
    # The JSON preset the control plane sets on the `docker compose` process for an isolated start; empty leaves the
    # literal values of config.yaml in charge (CTRL-RUNTIME-009).
    COHOST_ISOLATION: ${COHOST_ISOLATION:-}  # @spec DEPLOY-COMPOSE-017
  volumes:
    - ./config:/app/config

services:  # @spec DEPLOY-COMPOSE-001
  # ---------- infrastructure ----------
  redis:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-009, DEPLOY-COMPOSE-013, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]   # for `pnpm dev` outside docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-009, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cohost
      POSTGRES_PASSWORD: cohost
      POSTGRES_DB: cohost
    volumes: [pg18-data:/var/lib/postgresql]   # Postgres 18+ keeps its cluster under /var/lib/postgresql/<major>/docker
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohost"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-012, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"

  # Pulls the Ollama models config.yaml names (llm.model, llm.embed_model, vision.model and the hook models) once ollama is
  # up, then exits (the config package's pull-models entry, built into the memory image). It exits non-zero if a pull of the
  # LLM, vision or embedding model fails (no restart policy: a failed run stays visible in `docker compose ps`); a hook model
  # that fails to pull is a warning, that hook then falls back to its rules. The model names come from config.yaml only.
  models:  # @spec DEPLOY-COMPOSE-008, DEPLOY-COMPOSE-011
    build: { context: ., args: { SERVICE: memory } }
    command: ["node", "packages/config/dist/pull-models.js"]
    environment:
      OLLAMA_URL: http://ollama:11434
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config
    depends_on:
      ollama: { condition: service_started }

  tts:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0}
    restart: unless-stopped
    ports: ["127.0.0.1:8880:8880"]

  stt:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cpu}
    restart: unless-stopped
    volumes: [stt-cache:/home/ubuntu/.cache/huggingface/hub]
    ports: ["127.0.0.1:8000:8000"]

  # ---------- optional speech engine servers (DEPLOY-ENG-001..020) ----------
  # Each is built from a pinned source and runs behind its own profile; the owner enables it in COMPOSE_PROFILES in .env and
  # selects it in config.yaml. Each caches its weights under /root/.cache, in its own volume. None is an application service:
  # no SERVICE build argument, no x-ts-service anchor, no ./config mount, no env_file. Engine servers publish on loopback only.
  tts-pocket:  # @spec DEPLOY-ENG-001, DEPLOY-ENG-004, DEPLOY-ENG-008, DEPLOY-ENG-009, DEPLOY-ENG-011, DEPLOY-ENG-012, DEPLOY-ENG-014, DEPLOY-ENG-015, DEPLOY-ENG-019
    image: cohost-tts-pocket:4.0.1
    build:
      context: https://github.com/kyutai-labs/pocket-tts.git#a922b912dfa366975294afb568d815b305acde5d   # tag v4.0.1
    profiles: [pocket]
    restart: unless-stopped
    # The entrypoint exports the Pocket token for this server alone (DEPLOY-ENG-014, DEPLOY-ENG-019); the command is the
    # upstream image's own ENTRYPOINT and CMD, which the cohost entrypoint replaces.
    entrypoint: ["/bin/sh", "/cohost/entrypoint.sh"]
    command: ["uv", "run", "pocket-tts", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8881:8000"]
    volumes:
      - tts-pocket-cache:/root/.cache
      - ./docker/tts-pocket/entrypoint.sh:/cohost/entrypoint.sh:ro
      - ./data/tts-pocket-secret:/run/cohost-secret:ro
    healthcheck:  # @spec DEPLOY-ENG-012
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m

  stt-nemotron:  # @spec DEPLOY-ENG-002, DEPLOY-ENG-005, DEPLOY-ENG-008, DEPLOY-ENG-009, DEPLOY-ENG-011, DEPLOY-ENG-012
    image: cohost-stt-nemotron:0.3.0
    build:
      context: docker/stt-nemotron
    profiles: [nemotron]
    restart: unless-stopped
    command: ["nemo-speech", "serve", "--host", "0.0.0.0", "--port", "8080", "--asr-model", "nvidia/nemotron-speech-streaming-en-0.6b"]
    ports: ["127.0.0.1:8081:8080"]
    volumes: [stt-nemotron-cache:/root/.cache]
    healthcheck:  # @spec DEPLOY-ENG-012
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m

  stt-kyutai:  # @spec DEPLOY-ENG-003, DEPLOY-ENG-006, DEPLOY-ENG-008, DEPLOY-ENG-009, DEPLOY-ENG-011, DEPLOY-ENG-012
    image: cohost-stt-kyutai:0.6.4
    build:
      context: docker/stt-kyutai
    profiles: [kyutai]
    restart: unless-stopped
    command: ["moshi-server", "worker", "--config", "/etc/moshi/stt.toml", "--addr", "0.0.0.0", "--port", "8080"]
    ports: ["127.0.0.1:8082:8080"]
    volumes: [stt-kyutai-cache:/root/.cache]
    healthcheck:  # @spec DEPLOY-ENG-012
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m

  # ---------- co-host services ----------
  # chat also mounts ./data/chat: the refreshed Twitch token it persists there must survive the container being recreated.
  chat:  # @spec DEPLOY-COMPOSE-022
    <<: *ts-service
    build: { context: ., args: { SERVICE: chat } }
    volumes:
      - ./config:/app/config
      - ./data/chat:/app/data/chat

  # ---------- the brain: four regions that only talk over the bus ----------
  # salience decides *when* to speak (and fires reflexes), affect keeps the mood,
  # memory owns Postgres, cortex is the only one that calls the chat LLM.
  salience:
    <<: *ts-service
    build: { context: ., args: { SERVICE: salience } }

  affect:
    <<: *ts-service
    build: { context: ., args: { SERVICE: affect } }

  memory:
    <<: *ts-service
    build: { context: ., args: { SERVICE: memory } }
    depends_on:  # @spec DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }

  # One-shot viewer-note consolidation (the memory image, `consolidate` entry point): run it by hand after
  # shutting the AI down, `docker compose run --rm consolidate` (or `cohostctl consolidate`). Profile `maintenance`
  # keeps it out of `docker compose up`. Best-effort: memory catches up at its next start if it never runs.
  # No redis: the entry point never opens the bus. Inherits the anchor's env_file, environment, volumes
  # (./config) and extra_hosts; depends_on is restated because a service's own map replaces the anchor's.
  consolidate:  # @spec DEPLOY-COMPOSE-018, DEPLOY-COMPOSE-019
    <<: *ts-service
    build: { context: ., args: { SERVICE: memory } }
    command: ["node", "services/memory/dist/consolidate.js"]
    restart: "no"
    profiles: [maintenance]  # @spec DEPLOY-COMPOSE-004
    healthcheck: { disable: true }  # no heartbeat to check: the one-shot never joins the bus
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }

  # One-shot vector migration (the memory image, `reembed` entry point): after changing the embedder to one with another
  # vector size the memory service refuses to start ("memories table has vector(N)"); stop it, then run
  # `docker compose run --rm reembed` (or `cohostctl reembed`) to re-embed every stored row. Profile `maintenance`, no redis.
  reembed:  # @spec DEPLOY-COMPOSE-021
    <<: *ts-service
    build: { context: ., args: { SERVICE: memory } }
    command: ["node", "services/memory/dist/reembed.js"]
    restart: "no"
    profiles: [maintenance]  # @spec DEPLOY-COMPOSE-004
    healthcheck: { disable: true }  # no heartbeat to check: the one-shot never joins the bus
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }

  cortex:
    <<: *ts-service
    build: { context: ., args: { SERVICE: cortex } }
    depends_on:  # @spec DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      ollama: { condition: service_started }

  voice:  # @spec DEPLOY-COMPOSE-005, DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-007
    <<: *ts-service
    build: { context: ., args: { SERVICE: voice } }
    ports: ["127.0.0.1:8700:8700"]   # for the host-run dashboard (audio proxy, /health); containers use http://voice:8700
    depends_on:  # @spec DEPLOY-ENG-013, DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      tts: { condition: service_started }
      tts-pocket: { condition: service_started, required: false }

  # The tool-calling unit (services/tools, TOOL-SVC-*). Least privilege (DEPLOY-COMPOSE-026): no env_file, and no database
  # or engine address; it gets the bus address, the config directory it reads and the isolation pass-through, plus its
  # ./config mount and the host gateway (host-side MCP servers). It has no profile, so a plain `docker compose up -d` runs it.
  tools:  # @spec DEPLOY-COMPOSE-026, DEPLOY-COMPOSE-027
    <<: *ts-base
    build: { context: ., args: { SERVICE: tools } }
    environment:
      REDIS_URL: redis://redis:6379
      CONFIG_DIR: /app/config
      COHOST_ISOLATION: ${COHOST_ISOLATION:-}  # @spec DEPLOY-COMPOSE-017
    volumes:
      - ./config:/app/config:ro   # read-only: tools never writes config (DEPLOY-COMPOSE-026)

  # @spec DEPLOY-COMPOSE-028
  avatar:
    <<: *ts-service
    build: { context: ., args: { SERVICE: avatar } }

  eyes:
    <<: *ts-service
    build: { context: ., args: { SERVICE: eyes } }
    profiles: [eyes]  # @spec DEPLOY-COMPOSE-004

  ears:
    <<: *ts-service
    build: { context: ., args: { SERVICE: ears } }
    profiles: [ears]  # @spec DEPLOY-COMPOSE-004
    depends_on:  # @spec DEPLOY-COMPOSE-005, DEPLOY-ENG-013
      redis: { condition: service_healthy }
      stt: { condition: service_started }
      stt-nemotron: { condition: service_started, required: false }
      stt-kyutai: { condition: service_started, required: false }

  # The speaking half (writes her voice to the connectors' sinks). Off by default like ears: profile `mouth`. Waits for
  # redis only (the anchor's depends_on): it reaches voice by URL and covers a voice outage with its cached fallback clip.
  # No port and no volume of its own: the clip cache lives in the container's filesystem.
  mouth:  # @spec DEPLOY-COMPOSE-020
    <<: *ts-service
    build: { context: ., args: { SERVICE: mouth } }
    profiles: [mouth]  # @spec DEPLOY-COMPOSE-004

  # The Discord connector (CONN-*): the one bot login and voice connection, publishing source `discord` and playing sink
  # `discord` over the bus. Off by default: profile `discord`. Waits for redis only; no port and no volume. The bot token is
  # connections.discord.token in config/secrets.yaml, read through the shared ./config mount like every credential.
  connector-discord:  # @spec DEPLOY-COMPOSE-023
    <<: *ts-service
    build: { context: ., args: { SERVICE: connector-discord } }
    profiles: [discord]  # @spec DEPLOY-COMPOSE-004

volumes:  # @spec DEPLOY-COMPOSE-009
  redis-data:
  pg18-data:
  ollama-data:
  stt-cache:
  tts-pocket-cache:  # @spec DEPLOY-ENG-009, DEPLOY-COMPOSE-009
  stt-nemotron-cache:
  stt-kyutai-cache:
