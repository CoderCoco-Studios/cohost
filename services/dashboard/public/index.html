<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cohost · __COHOST_NAME__</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7; --acc:#7c9cff; --ok:#5ad47f; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-sans-serif,system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600 }
  .pill { padding:3px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--dim); font-size:12px }
  .pill.idle{color:var(--dim)} .pill.thinking{color:var(--warn)} .pill.speaking{color:var(--ok)} .pill.muted{color:var(--bad)}
  main { display:grid; grid-template-columns: 1fr 320px; gap:12px; padding:12px; height:calc(100vh - 49px); }
  @media (max-width:800px){ main{grid-template-columns:1fr; height:auto} }
  .col { display:flex; flex-direction:column; gap:12px; min-height:0 }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:0 }
  .panel h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim) }
  #feed { flex:1; overflow:auto; font-family:ui-monospace,Menlo,monospace; font-size:12.5px }
  .ev { padding:3px 0; border-bottom:1px solid #1d2129; display:flex; gap:8px }
  .ev .t { color:var(--dim); flex:0 0 58px }
  .ev .k { flex:0 0 110px; color:var(--acc) }
  .ev.say .k{color:var(--ok)} .ev.chat .k{color:#c7a5ff} .ev.vision .k{color:#7fd6e0} .ev.speech .k{color:var(--warn)} .ev.status{opacity:.55}
  button { background:#232838; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer }
  button:hover{border-color:var(--acc)} button.on{background:var(--acc); color:#0b0d12; border-color:var(--acc)}
  input, textarea { width:100%; background:#0f1218; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:7px; font:inherit }
  textarea { font-family:ui-monospace,Menlo,monospace; font-size:12px; min-height:260px; resize:vertical }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap }
  svg { width:100%; height:auto; display:block }
  .tab.on{background:var(--acc); color:#0b0d12; border-color:var(--acc)}
  #services { padding:12px; display:none } #services.show { display:block }
  main.hide { display:none }
  table.svc { width:100%; border-collapse:collapse; font-size:13px }
  .svc th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line) }
  .svc td { padding:6px 8px; border-bottom:1px solid #1d2129; vertical-align:top }
  .badge { display:inline-block; padding:1px 9px; border-radius:999px; border:1px solid var(--line); font-size:12px }
  .badge.up{color:var(--ok); border-color:var(--ok)} .badge.degraded{color:var(--warn); border-color:var(--warn)} .badge.stale{color:var(--warn)}
  .badge.down,.badge.crash-looping{color:var(--bad); border-color:var(--bad)} .badge.unknown{color:var(--dim)}
  .dep.ok{color:var(--ok)} .dep.down{color:var(--bad)} .dep.na{color:var(--dim)}
  .sink main, .sink #services, .sink .tab { display:none }  /* ?sink=1 : audio only, for OBS browser source */  /* ?sink=1 : audio only, for OBS browser source */
  .hint { color:var(--dim); font-size:12px }
  .svc td.act { white-space:nowrap } .svc td.act button { padding:2px 8px; font-size:12px }
  #ctlBar select, #ctlBar label { font-size:12px; color:var(--dim) } #ctlBar select { background:#0f1218; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:3px }
  .badge.inj { color:var(--warn); border-color:var(--warn); font-size:11px; padding:0 7px; margin-left:6px }
  .badge.mem { color:var(--ok); border-color:var(--ok); font-size:11px; padding:0 7px; margin-left:4px }
  #injText { min-height:60px; margin-bottom:6px }
  #injStatus.ok{color:var(--ok)} #injStatus.bad{color:var(--bad)}
  .inj-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px }
</style>
</head>
<body>
<header>
  <h1>__COHOST_NAME__</h1>
  <span id="status" class="pill idle">connecting…</span>
  <span id="driver" class="pill">avatar: —</span>
  <button id="tabLive" class="tab on">live</button>
  <button id="tabServices" class="tab">services</button>
  <span style="flex:1"></span>
  <button id="audio">🔇 enable audio</button>
  <button id="mute">mute</button>
</header>
<main id="live">
  <section class="col">
    <div class="panel" style="flex:1; display:flex; flex-direction:column">
      <h2>bus</h2>
      <div id="feed"></div>
    </div>
    <div class="panel">
      <h2>say something</h2>
      <div class="row"><input id="say" placeholder="Type a line for the co-host to speak…"><button id="sayBtn">say</button><button id="forget">wipe context</button></div>
    </div>
    <div class="panel" id="injPanel">
      <h2>test inputs</h2>
      <textarea id="injText" placeholder="Type a fake viewer message (or the speech / screen line at bus level)…"></textarea>
      <div class="inj-grid">
        <input id="injUser" placeholder="viewer name (default injected_viewer)">
        <select id="injPlatform"><option>twitch</option><option>youtube</option><option>discord</option></select>
      </div>
      <div class="row" style="margin-bottom:6px">
        <label>level <select id="injLevel"><option value="service">service (real pipeline)</option><option value="bus">bus (skip perception)</option></select></label>
        <label id="injAsWrap" style="display:none">as <select id="injAs"><option value="chat">chat</option><option value="speech">speech</option><option value="vision">vision</option></select></label>
        <label><input type="checkbox" id="injMod" style="width:auto"> mod</label>
        <label><input type="checkbox" id="injSub" style="width:auto"> sub</label>
        <label title="Off: the memory region ignores this input and any reply to it"><input type="checkbox" id="injRemember" style="width:auto"> store in memory</label>
      </div>
      <div class="row" style="margin-bottom:6px"><button id="injSend">send text</button></div>
      <div class="row" style="margin-bottom:6px"><input type="file" id="injImage" accept="image/png,image/jpeg,image/webp"><button id="injImageBtn">send image</button></div>
      <div class="row" style="margin-bottom:6px"><input type="file" id="injAudio" accept="audio/*"><button id="injAudioBtn">send audio</button><button id="injRec" style="display:none">&#9210; record</button></div>
      <div id="injStatus" class="hint">Injected input is treated as real by the brain and may be spoken aloud.</div>
    </div>
  </section>
  <section class="col">
    <div class="panel">
      <h2>avatar preview</h2>
      <svg id="face" viewBox="0 0 200 200">
        <g id="head">
          <circle cx="100" cy="100" r="70" fill="#2b3142" stroke="#3b4357" stroke-width="2"/>
          <g id="eyes">
            <ellipse id="eyeL" cx="75" cy="88" rx="7" ry="9" fill="#e6e8ee"/>
            <ellipse id="eyeR" cx="125" cy="88" rx="7" ry="9" fill="#e6e8ee"/>
          </g>
          <path id="mouth" d="M80 130 Q100 134 120 130" stroke="#e6e8ee" stroke-width="3" fill="#1a1d26" stroke-linecap="round"/>
        </g>
        <text id="emo" x="100" y="190" text-anchor="middle" fill="#8b93a7" font-size="12">neutral</text>
      </svg>
    </div>
    <div class="panel" style="flex:1; display:flex; flex-direction:column">
      <h2>personality.md</h2>
      <textarea id="pers" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button id="savePers">save &amp; reload</button><span id="persMsg" class="hint"></span></div>
    </div>
  </section>
</main>
<section id="services">
  <div class="panel">
    <h2>services <span id="svcNote" class="hint"></span></h2>
    <div id="ctlBar" class="row" style="display:none; margin-bottom:8px">
      <label>start mode <select id="ctlMode"><option value="">default (per service)</option><option value="resume">resume (keep backlog)</option><option value="fresh">fresh (skip backlog)</option></select></label>
      <label><input type="checkbox" id="ctlIso" style="width:auto"> isolated (mock/off backends)</label>
      <span id="ctlMsg" class="hint"></span>
    </div>
    <table class="svc">
      <thead><tr><th>service</th><th>state</th><th>mode</th><th>deps</th><th>last seen</th><th>restarts</th><th>detail</th><th id="actHead" style="display:none">control</th></tr></thead>
      <tbody id="svcRows"></tbody>
    </table>
  </div>
</section>
<script>
const $ = (s) => document.querySelector(s);
const isSink = new URLSearchParams(location.search).has("sink");
if (isSink) document.body.classList.add("sink");

// ---------- audio sink
let audioOn = isSink; // OBS browser sources allow autoplay; normal browsers need a click
const queue = []; let playing = false;
$("#audio").onclick = () => { audioOn = !audioOn; $("#audio").textContent = audioOn ? "🔊 audio on" : "🔇 enable audio"; $("#audio").classList.toggle("on", audioOn); if (audioOn) pump(); };
async function pump() {
  if (!audioOn || playing || !queue.length) return;
  const u = queue.shift(); playing = true;
  const a = new Audio(`/audio/${u.id}.wav`);
  a.onplay = () => post("/sink", { event: "playing", id: u.id });
  a.onended = a.onerror = () => { post("/sink", { event: "done", id: u.id }); playing = false; pump(); };
  try { await a.play(); } catch (e) { playing = false; audioOn = false; $("#audio").textContent = "🔇 enable audio"; }
}
// When service control is enabled the server wants a bearer token on every mutating call.
// It is asked for on the first 401 and kept for this tab only (sessionStorage).
const tokenGet = () => { try { return sessionStorage.getItem("controlToken") || ""; } catch { return ""; } };
const tokenSet = (t) => { try { sessionStorage.setItem("controlToken", t); } catch {} };
async function authFetch(path, init = {}) {
  const go = () => fetch(path, { ...init, headers: { ...(init.headers || {}), ...(tokenGet() ? { authorization: "Bearer " + tokenGet() } : {}) } });
  let r = await go();
  if (r.status === 401) {
    const t = prompt("Control token (CONTROL_TOKEN):");
    if (t) { tokenSet(t.trim()); r = await go(); }
  }
  return r;
}
const post = (p, b) => authFetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) });

// ---------- controls
let muted = false;
$("#mute").onclick = () => { muted = !muted; post("/control", { cmd: muted ? "mute" : "unmute" }); $("#mute").textContent = muted ? "unmute" : "mute"; $("#mute").classList.toggle("on", muted); };
$("#sayBtn").onclick = () => { const t = $("#say").value.trim(); if (t) { post("/control", { cmd: "say", text: t }); $("#say").value = ""; } };
$("#say").onkeydown = (e) => { if (e.key === "Enter") $("#sayBtn").click(); };
$("#forget").onclick = () => post("/control", { cmd: "forget_context" });
fetch("/personality").then(r => r.text()).then(t => $("#pers").value = t);
$("#savePers").onclick = async () => { await authFetch("/personality", { method: "PUT", body: $("#pers").value }); $("#persMsg").textContent = "saved · brain reloaded"; setTimeout(() => $("#persMsg").textContent = "", 2500); };

// ---------- test inputs
const injSet = (msg, cls = "") => { const el = $("#injStatus"); el.textContent = msg; el.className = "hint " + cls; };
const TARGET = { text: "chat", image: "eyes", audio: "ears" };
const injResults = new Map(); // id -> inject.result data, for results that beat the HTTP response
const injPending = new Map(); // id -> timeout handle
function injShow(r) { injSet(r.ok ? `ok${r.detail ? ": " + r.detail : ""}` : `failed${r.detail ? ": " + r.detail : ""}`, r.ok ? "ok" : "bad"); }
function injTrack(id, kind) {
  if (injResults.has(id)) { injShow(injResults.get(id)); return; }
  injSet(`sent to ${TARGET[kind]}, waiting for result…`);
  injPending.set(id, setTimeout(() => { injPending.delete(id); injSet(`no response from ${TARGET[kind]} after 10 s (is it running?)`, "bad"); }, 10000));
}
function onInjectResult(r) {
  injResults.set(r.id, r);
  if (injResults.size > 50) injResults.delete(injResults.keys().next().value);
  if (injPending.has(r.id)) { clearTimeout(injPending.get(r.id)); injPending.delete(r.id); injShow(r); }
}
async function injFinish(r, kind, level) {
  if (!r.ok) { injSet(`rejected (${r.status}): ${(await r.text()).slice(0, 200)}`, "bad"); return; }
  const { id } = await r.json();
  if (level === "bus") injSet("published at bus level (no service result)", "ok"); else injTrack(id, kind);
}
const injFlags = () => ({ remember: $("#injRemember").checked });
$("#injLevel").onchange = () => {
  const bus = $("#injLevel").value === "bus";
  $("#injAsWrap").style.display = bus ? "" : "none";
  for (const id of ["#injImage", "#injImageBtn", "#injAudio", "#injAudioBtn", "#injRec"]) $(id).disabled = bus;
};
$("#injSend").onclick = async () => {
  const level = $("#injLevel").value, text = $("#injText").value.trim();
  if (!text) { injSet("type some text first", "bad"); return; }
  const body = { level, text, ...injFlags(), user: $("#injUser").value.trim() || undefined, platform: $("#injPlatform").value, isMod: $("#injMod").checked, isSub: $("#injSub").checked };
  if (level === "bus") body.as = $("#injAs").value;
  try { await injFinish(await post("/inject/text", body), "text", level); } catch (e) { injSet("failed: " + e, "bad"); }
};
async function injUpload(kind, blob, type) {
  const q = new URLSearchParams({ level: "service", remember: $("#injRemember").checked ? "1" : "0" });
  const user = $("#injUser").value.trim();
  if (kind === "audio" && user) q.set("user", user);
  try { await injFinish(await authFetch(`/inject/${kind}?${q}`, { method: "POST", headers: { "content-type": type }, body: blob }), kind, "service"); }
  catch (e) { injSet("failed: " + e, "bad"); }
}
$("#injImageBtn").onclick = () => { const f = $("#injImage").files[0]; if (f) injUpload("image", f, f.type); else injSet("choose an image first", "bad"); };
$("#injAudioBtn").onclick = () => { const f = $("#injAudio").files[0]; if (f) injUpload("audio", f, f.type); else injSet("choose an audio file first", "bad"); };
// Optional microphone capture, only offered where MediaRecorder + getUserMedia exist.
if (window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  let rec = null;
  $("#injRec").style.display = "";
  $("#injRec").onclick = async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const type = (rec.mimeType || "audio/webm").split(";")[0];
        rec = null; $("#injRec").textContent = "\u23FA record"; $("#injRec").classList.remove("on");
        injUpload("audio", new Blob(chunks, { type }), type);
      };
      rec.start(); $("#injRec").textContent = "\u23F9 stop & send"; $("#injRec").classList.add("on");
    } catch (e) { rec = null; injSet("microphone unavailable: " + e, "bad"); }
  };
}

// ---------- tabs + services
function showTab(name) {
  $("#live").classList.toggle("hide", name !== "live");
  $("#services").classList.toggle("show", name === "services");
  $("#tabLive").classList.toggle("on", name === "live");
  $("#tabServices").classList.toggle("on", name === "services");
}
$("#tabLive").onclick = () => showTab("live");
$("#tabServices").onclick = () => showTab("services");

let svc = [], svcAt = 0;
function renderServices() {
  const extra = svcAt ? Date.now() - svcAt : 0; // age shown = age at push + time since the push arrived
  $("#svcRows").innerHTML = svc.map((s) => {
    const h = s.heartbeat;
    const deps = h ? Object.entries(h.deps).map(([k, v]) => `<span class="dep ${v === "n/a" ? "na" : v}">${esc(k)}: ${esc(v)}</span>`).join(" · ") || "—" : "—";
    const age = s.lastSeenAgeMs == null ? "never" : `${Math.round((s.lastSeenAgeMs + extra) / 1000)}s ago`;
    return `<tr><td>${esc(s.service)}</td><td><span class="badge ${s.state}">${s.state}</span></td><td>${h ? esc(h.mode) : "—"}</td>` +
      `<td>${deps}</td><td>${age}</td><td>${s.restarts}</td><td class="hint">${h && h.detail ? esc(h.detail) : ""}</td>${actions(s.service)}</tr>`;
  }).join("");
  const bad = svc.filter((s) => ["down", "crash-looping", "stale"].includes(s.state)).length;
  $("#svcNote").textContent = bad ? `· ${bad} need attention` : "";
  $("#tabServices").textContent = bad ? `services (${bad})` : "services";
}
// ---------- service control (only rendered when GET /services/control says enabled)
let ctlEnabled = false;
const ACTIONS = ["start", "stop", "restart"];
function actions(id) {
  if (!ctlEnabled) return "";
  const self = id === "dashboard"; // the dashboard cannot stop itself
  return `<td class="act">${ACTIONS.filter((a) => !(self && a !== "start")).map((a) => `<button data-act="${a}" data-svc="${esc(id)}">${a}</button>`).join(" ")}</td>`;
}
fetch("/services/control").then((r) => r.json()).then((c) => {
  ctlEnabled = !!c.enabled;
  $("#ctlBar").style.display = ctlEnabled ? "" : "none";
  $("#actHead").style.display = ctlEnabled ? "" : "none";
  renderServices();
}).catch(() => {});
$("#svcRows").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.svc;
  const mode = $("#ctlMode").value, isolated = $("#ctlIso").checked;
  const how = [mode && `mode ${mode}`, isolated && "isolated"].filter(Boolean).join(", ");
  if (!confirm(`${act} ${id}${act !== "stop" && how ? ` (${how})` : ""}?`)) return;
  $("#ctlMsg").textContent = `${act} ${id}…`;
  try {
    const body = act === "stop" ? {} : { ...(mode ? { mode } : {}), ...(isolated ? { isolated: true } : {}) };
    const r = await post(`/services/${encodeURIComponent(id)}/${act}`, body);
    const j = await r.json().catch(() => ({}));
    $("#ctlMsg").textContent = r.ok && j.ok ? `${act} ${id}: ok${j.detail ? " · " + j.detail : ""}` : `${act} ${id} failed (${r.status})${j.detail ? ": " + j.detail : ""}`;
  } catch (err) { $("#ctlMsg").textContent = `${act} ${id} failed: ${err}`; }
});
setInterval(renderServices, 1000);
function onServices(list) { svc = list; svcAt = Date.now(); renderServices(); }

// ---------- feed + state
const feed = $("#feed");
function line(ev) {
  const d = ev.data, t = new Date(ev.ts).toLocaleTimeString([], { hour12: false });
  let cls = "", text = "";
  switch (ev.type) {
    case "chat.message": cls = "chat"; text = `${d.user}: ${d.text}`; break;
    case "brain.say": cls = "say"; text = `[${d.emotion}] ${d.text}  ← ${d.reason || ""}`; break;
    case "vision.summary": cls = "vision"; text = d.text; break;
    case "speech.heard": cls = "speech"; text = `${d.speaker}: ${d.text}`; break;
    case "brain.status": cls = "status"; text = d.state + (d.detail ? ` · ${d.detail}` : ""); break;
    case "control": cls = "status"; text = d.cmd + (d.target ? ` → ${d.target}` : "") + (d.text ? ` "${d.text}"` : ""); break;
    case "service.lifecycle": cls = "status"; text = `${d.action} ${d.service} by ${d.by} · ${d.ok ? "ok" : "FAILED"}${d.detail ? ` (${d.detail})` : ""}`; break;
    case "inject.request": cls = "status"; text = `→ ${d.target} ${d.kind}${d.text ? ` "${d.text}"` : ""}${d.remember ? " (remember)" : ""}`; break;
    case "inject.result": cls = "status"; text = `${d.ok ? "ok" : "FAILED"}${d.detail ? " · " + d.detail : ""}`; break;
    case "voice.utterance": cls = "status"; text = `audio ready ${Math.round(d.durationMs)}ms`; break;
    case "voice.playing": case "voice.done": cls = "status"; text = `${d.sink}`; break;
    default: return;
  }
  const el = document.createElement("div"); el.className = "ev " + cls;
  el.innerHTML = `<span class="t">${t}</span><span class="k">${ev.type}</span><span>${esc(text)}${d.injected ? '<span class="badge inj">injected</span>' + (d.remember ? '<span class="badge mem">remembered</span>' : "") : ""}</span>`;
  feed.appendChild(el); while (feed.children.length > 300) feed.firstChild.remove();
  feed.scrollTop = feed.scrollHeight;
}
const esc = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function onEvent(ev) {
  if (ev.type === "services") { onServices(ev.services); return; }
  if (ev.type === "inject.result") onInjectResult(ev.data);
  if (ev.type === "avatar.state") { drawFace(ev.data); return; }
  if (ev.type === "brain.status") { const s = $("#status"); s.className = "pill " + ev.data.state; s.textContent = ev.data.state; }
  if (ev.type === "voice.utterance") { queue.push(ev.data); pump(); }
  line(ev);
}
function drawFace(s) {
  $("#driver").textContent = `avatar: ${s.driver}${s.connected ? "" : " (disconnected)"}`;
  $("#head").setAttribute("transform", `translate(${s.headX * 0.8} ${-s.headY * 0.8}) rotate(${s.headZ} 100 100)`);
  const ry = Math.max(0.5, 9 * (1 - s.blink));
  for (const id of ["eyeL", "eyeR"]) { const e = $("#" + id); e.setAttribute("ry", ry); e.setAttribute("cx", (id === "eyeL" ? 75 : 125) + s.eyeX * 4); e.setAttribute("cy", 88 + s.eyeY * 3); }
  const open = 4 + s.mouthOpen * 22, smile = s.mouthSmile * 10;
  $("#mouth").setAttribute("d", `M80 128 Q100 ${128 + smile + open} 120 128 Q100 ${128 + smile - open * 0.3} 80 128`);
  $("#emo").textContent = s.emotion;
}
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (m) => onEvent(JSON.parse(m.data));
  ws.onclose = () => { $("#status").textContent = "reconnecting…"; setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
