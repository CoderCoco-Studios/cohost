name: lid-check

# @spec DEPLOY-CI-006, DEPLOY-CI-012, DEPLOY-TOOL-018
# Linked-intent coherence: every @spec ID cited in code exists in a spec file, no ID is defined twice, and
# no spec file cites an ID that was deleted. Reads files only, so Node is the one tool and nothing is installed
# from the workspace.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lid-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: node
      - run: MISE_TASK_RUN_AUTO_INSTALL=false mise run lid-check
