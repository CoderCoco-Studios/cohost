# The credentials part of `mise run config:import -- --secrets <file>` (settings-store STORE-IO-004): a plain mapping nested by
# secret path, every value a string (put a value made only of digits in quotes). The import encrypts each one into the settings
# store; a path that is not a credential of this build is left out and listed as a note, never with its value. A credential left
# as "" is not set. Fill in a copy outside the checkout (never commit it), import it, then delete the copy: the store keeps the
# credentials and the dashboard reports each only as set or not set. A single credential is set on the dashboard's Settings
# screen or with `mise run config:secret -- <path>`.
llm:
  openai:
    api_key: ""   # llm.provider: openai; the API key of the endpoint named by llm.openai.base_url (OpenAI, OpenRouter, Groq, a vLLM box)
  claude:
    api_key: ""   # llm.provider: anthropic; a Claude API key from https://platform.claude.com/settings/keys
  bedrock:
    access_key_id: ""       # llm.provider: bedrock; an AWS access key id (an IAM user's, from the IAM console); Compose mounts no ~/.aws
    secret_access_key: ""   # llm.provider: bedrock; the secret access key that goes with the access key id

vision:
  obs:
    password: ""  # the OBS WebSocket password (OBS: Tools > WebSocket Server Settings); empty if the server needs none

chat:
  twitch:
    client_id: ""       # the Twitch application's client id (https://dev.twitch.tv/console; scopes chat:read chat:edit)
    client_secret: ""   # the Twitch application's client secret
    access_token: ""    # a user access token for the bot account
    refresh_token: ""   # its refresh token; required whenever access_token is set

connections:
  discord:
    token: ""     # the co-host's one Discord bot, used by the Discord connector (https://discord.com/developers); invite it with Connect and Speak and enable the Server Members intent

# One credential per MCP server: write the entry under the server's name in config.yaml (tools.servers). It is sent in the
# server's header (tools.servers.<name>.header, Authorization when blank) on every call, so give it only to a server you trust.
# tools:
#   servers:
#     <name>:
#       token: ""   # the bearer credential for the MCP server named <name>; from that server's own settings, empty if it needs none
