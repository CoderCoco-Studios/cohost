[package]
name = "cohost-desktop-audio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cohost-bus = { version = "0.1.0", path = "../cohost-bus" }
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "signal"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[target."cfg(windows)".dependencies]
wasapi = "0.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
futures = { version = "0.3.34", default-features = false, features = ["executor", "std"] }
pulseaudio = "0.3.2"
