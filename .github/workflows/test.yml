name: test

# @spec DEPLOY-CI-001, DEPLOY-CI-012
# Every step is an action or one `mise run <task>`: the checks CI runs are the commands a developer runs.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis lets the bus round-trip test run instead of skipping itself.
    services:
      redis:
        image: redis:8.10.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # pgvector lets the memory store's real-Postgres tests run instead of skipping themselves (DEPLOY-CI-008).
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: cohost
          POSTGRES_PASSWORD: cohost
          POSTGRES_DB: cohost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohost -d cohost_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      COHOST_TEST_DATABASE_URL: postgres://cohost:cohost@127.0.0.1:5432/cohost_test
    steps:
      - uses: actions/checkout@v7.0.1
      # Every tool of mise.toml (Node, pnpm, Rust, Zig, Python, watchexec), installed --locked from mise.lock.
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/mise/cargo/registry/index
            ~/.local/share/mise/cargo/registry/cache
            ~/.local/share/mise/cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'mise.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: mise run lint
      # test:rust (cargo test, the Windows check), then the build, then the TypeScript suite.
      - run: mise run test
      # The Rust bus example's round trip must run, not skip (BUS-NAT-CI-002).
      - run: mise run test:rust-example
