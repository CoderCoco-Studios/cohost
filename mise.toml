# ------------------------------------------------------------------------------------------ docs site

[tasks."docs:build"]
description = "Check and build the docs site (skipped while its sources are unchanged)"
depends = ["install"]
run = ["node scripts/docs-check.mjs", "vitepress build docs", "node scripts/docs-check.mjs --dist"]
sources = ["docs/**", "!docs/.vitepress/dist/**", "!docs/.vitepress/cache/**", "scripts/docs-check.mjs", "examples/**", "README.md"]
outputs = ["docs/.vitepress/dist/index.html"]

[tasks."docs:dev"]
description = "Run the docs site's dev server"
depends = ["install"]
run = "vitepress dev docs"

[tasks."docs:preview"]
description = "Serve the built docs site"
depends = ["install"]
run = "vitepress preview docs"

