# Base stack. CPU-only by default; GPU is layered on via docker-compose.gpu.yml
# (install.sh writes COMPOSE_FILE into .env so plain `docker compose up` picks both).
#
#   docker compose up -d                 # everything
#   docker compose up -d chat salience affect memory cortex voice avatar dashboard   # minimal talking path
#   docker compose --profile ears up -d  # add the Discord voice bot
#   docker compose --profile eyes up -d  # add OBS vision

x-ts-service: &ts-service  # @spec DEPLOY-COMPOSE-002, DEPLOY-COMPOSE-015
  restart: unless-stopped
  env_file: .env
  environment:  # @spec DEPLOY-COMPOSE-003
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://cohost:cohost@postgres:5432/cohost
    OLLAMA_URL: http://ollama:11434
    TTS_URL: http://tts:8880
    STT_URL: http://stt:8000
    VOICE_URL: http://voice:8700
    DASHBOARD_URL: http://dashboard:3000   # eyes/ears fetch injected test uploads from here
    CONFIG_DIR: /app/config
    # Monitor-only in containers: a CONTROL_ENABLED=1 in .env must not rebind the dashboard to loopback.
    CONTROL_ENABLED: "0"  # @spec DEPLOY-COMPOSE-016
    # Isolation preset the control plane sets on the `docker compose` process; unset falls through to config.yaml.
    CHAT_SOURCE: ${CHAT_SOURCE:-}  # @spec DEPLOY-COMPOSE-017
    MEMORY_STORE: ${MEMORY_STORE:-}
    MEMORY_EMBEDDER: ${MEMORY_EMBEDDER:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-}
    VOICE_ENGINE: ${VOICE_ENGINE:-}
    AVATAR_DRIVER: ${AVATAR_DRIVER:-}
    VISION_ENABLED: ${VISION_ENABLED:-}
    EARS_SOURCE: ${EARS_SOURCE:-}
  volumes:
    - ./config:/app/config
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach OBS / VTube Studio on the host (Linux)
  depends_on:
    redis:
      condition: service_healthy
  # Healthy = the newest heartbeat on cohost:health is younger than 3x its interval and not
  # "stopping". $SERVICE is baked into the image (see Dockerfile). Applies to every app service.
  healthcheck:  # @spec DEPLOY-HC-001
    test: ["CMD-SHELL", "node packages/control/dist/healthcheck.js $$SERVICE"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s

services:  # @spec DEPLOY-COMPOSE-001
  # ---------- infrastructure ----------
  redis:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-009, DEPLOY-COMPOSE-013, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]   # for `pnpm dev` outside docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-009, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cohost
      POSTGRES_PASSWORD: cohost
      POSTGRES_DB: cohost
    volumes: [pg-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohost"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-012, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"

  # Pulls the models named in .env once ollama is up, then exits; exits non-zero if a pull of the
  # LLM, vision or embedding model fails (no restart policy: a failed run stays visible in
  # `docker compose ps`). NOTES_MODEL (viewer-note capture, default gemma3:4b) is pulled last and a
  # failed pull of it is only a warning: capture then writes no notes.
  models:  # @spec DEPLOY-COMPOSE-008, DEPLOY-COMPOSE-011, DEPLOY-COMPOSE-014
    image: curlimages/curl:latest
    env_file: .env
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        # pull <model>: returns 0 on success. -f: a non-2xx status fails; Ollama also reports a
        # mid-stream pull error as a 200 {"error":...} line.
        pull() {
          echo "pulling $$1"
          if curl -fsS http://ollama:11434/api/pull -d "{\"name\":\"$$1\"}" -o /tmp/pull.out && ! grep -q '"error"' /tmp/pull.out; then
            tail -c 200 /tmp/pull.out; echo
          else
            echo "pull FAILED: $$1" >&2; tail -c 200 /tmp/pull.out >&2; echo >&2; return 1
          fi
        }
        fail=0
        for m in "$$LLM_MODEL" "$$VISION_MODEL" "$$EMBED_MODEL"; do
          pull "$$m" || fail=1
        done
        notes="$${NOTES_MODEL:-gemma3:4b}"
        pull "$$notes" || echo "WARNING: notes model $$notes not pulled; viewer-note capture will write no notes" >&2
        exit $$fail

  tts:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    restart: unless-stopped
    ports: ["127.0.0.1:8880:8880"]

  stt:  # @spec DEPLOY-COMPOSE-006, DEPLOY-COMPOSE-014, DEPLOY-COMPOSE-015
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    volumes: [stt-cache:/home/ubuntu/.cache/huggingface/hub]
    ports: ["127.0.0.1:8000:8000"]

  # ---------- co-host services ----------
  chat:
    <<: *ts-service
    build: { context: ., args: { SERVICE: chat } }

  # ---------- the brain: four regions that only talk over the bus ----------
  # salience decides *when* to speak (and fires reflexes), affect keeps the mood,
  # memory owns Postgres, cortex is the only one that calls the chat LLM.
  salience:
    <<: *ts-service
    build: { context: ., args: { SERVICE: salience } }

  affect:
    <<: *ts-service
    build: { context: ., args: { SERVICE: affect } }

  memory:
    <<: *ts-service
    build: { context: ., args: { SERVICE: memory } }
    depends_on:  # @spec DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }

  cortex:
    <<: *ts-service
    build: { context: ., args: { SERVICE: cortex } }
    depends_on:  # @spec DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      ollama: { condition: service_started }

  voice:  # @spec DEPLOY-COMPOSE-005, DEPLOY-COMPOSE-007
    <<: *ts-service
    build: { context: ., args: { SERVICE: voice } }
    depends_on:
      redis: { condition: service_healthy }
      tts: { condition: service_started }

  avatar:
    <<: *ts-service
    build: { context: ., args: { SERVICE: avatar } }

  dashboard:  # @spec DEPLOY-COMPOSE-006
    <<: *ts-service
    build: { context: ., args: { SERVICE: dashboard } }
    # VIEWERS_TOKEN (Viewers page secret) reaches the dashboard through `env_file: .env` above; unset locks the page.
    ports: ["${DASHBOARD_PORT:-3000}:3000"]

  eyes:
    <<: *ts-service
    build: { context: ., args: { SERVICE: eyes } }
    profiles: [eyes]  # @spec DEPLOY-COMPOSE-004

  ears:
    <<: *ts-service
    build: { context: ., args: { SERVICE: ears } }
    profiles: [ears]  # @spec DEPLOY-COMPOSE-004
    depends_on:  # @spec DEPLOY-COMPOSE-005
      redis: { condition: service_healthy }
      stt: { condition: service_started }

volumes:  # @spec DEPLOY-COMPOSE-009
  redis-data:
  pg-data:
  ollama-data:
  stt-cache:
