[tasks.dev]
description = "Run every service, rebuilding and restarting on a source change"
run = "MISE_JOBS=12 mise watch --restart dev:affect ::: dev:avatar ::: dev:chat ::: dev:connector-discord ::: dev:cortex ::: dev:ears ::: dev:eyes ::: dev:memory ::: dev:mouth ::: dev:salience ::: dev:tools ::: dev:voice"

# ------------------------------------------------------------------------------------------ developer tools
# Arguments after the task name reach the program: `mise run bus:tail -- --replay 20`.
# @spec DEPLOY-TOOL-015

[tasks."bus:pub"]
description = "Publish one event onto the bus"
depends = ["build:native", "build:ts"]
run = "tsx scripts/dev/bus-pub.ts"

[tasks."bus:tail"]
description = "Print bus events as they arrive"
depends = ["build:native", "build:ts"]
run = "tsx scripts/dev/bus-tail.ts"

[tasks."bus:bench"]
description = "Benchmark the bus (TypeScript against native)"
depends = ["build:native", "build:ts"]
run = "tsx scripts/dev/bus-bench.ts"

[tasks."perf:connector"]
description = "Play a clip into ears as a test connector"
depends = ["build:native", "build:ts"]
run = "tsx scripts/dev/perf-connector.ts"

[tasks."perf:baseline"]
description = "Measure the end-to-end latency baseline against the running stack"
depends = ["build:native", "build:ts", "doctor:docker"]
run = "scripts/dev/perf-baseline.sh"

[tasks."stub:llm"]
description = "Run the stub LLM server on :11434"
depends = ["install"]
run = "tsx scripts/dev/stub-llm.ts"

[tasks."stub:tts"]
description = "Run the stub TTS server on :8880"
depends = ["install"]
run = "tsx scripts/dev/stub-tts.ts"

[tasks."hooks:schemas"]
description = "Write the hook reply schemas under examples/modules/schemas/"
depends = ["build:ts"]
run = "node scripts/gen-hook-schemas.mjs"

# ------------------------------------------------------------------------------------------ examples
# One task per program under examples/ that a page tells the reader to run from the checkout.
# @spec DEPLOY-TOOL-016

[tasks."example:hook-server:py"]
description = "Run the Python example hook server (:8900)"
run = "python3 examples/modules/server.py"

[tasks."example:hook-server:ts"]
description = "Run the TypeScript example hook server (:8900)"
run = "node examples/modules/server.ts"

[tasks."example:hook-server:rust"]
description = "Run the Rust example hook server (:8900)"
run = "cargo run --manifest-path examples/Cargo.toml -p cohost-example-hook-server"

[tasks."example:hook-try"]
description = "Send one request to each hook of a running example hook server"
run = "sh examples/modules/try.sh"

[tasks."example:model-stub:py"]
description = "Run the Python example model server stub (:8901)"
run = "python3 examples/model-stub/stub.py"

[tasks."example:model-stub:ts"]
description = "Run the TypeScript example model server stub (:8901)"
run = "node examples/model-stub/stub.ts"

[tasks."example:model-try"]
description = "Send the example requests to a running model server"
run = "sh examples/model-stub/try.sh"

[tasks."example:audio-send:sh"]
description = "Send a WAV clip to ears' http source (curl)"
run = "sh examples/audio-in/send.sh"

[tasks."example:audio-send:py"]
description = "Send a WAV clip to ears' http source (Python)"
run = "python3 examples/audio-in/send_clip.py"

[tasks."example:audio-send:ts"]
description = "Send a WAV clip to ears' http source (TypeScript)"
run = "node examples/audio-in/send-clip.ts"

[tasks."example:audio-wav:sox"]
