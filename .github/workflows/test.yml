name: test

# @spec DEPLOY-CI-001
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Redis lets the bus round-trip test run instead of skipping itself.
    services:
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # pgvector lets the memory store's real-Postgres tests run instead of skipping themselves (DEPLOY-CI-008).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cohost
          POSTGRES_PASSWORD: cohost
          POSTGRES_DB: cohost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohost -d cohost_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      COHOST_TEST_DATABASE_URL: postgres://cohost:cohost@127.0.0.1:5432/cohost_test
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
