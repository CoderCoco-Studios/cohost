name: docs-build

# @spec DEPLOY-CI-004, DEPLOY-CI-012, DEPLOY-TOOL-018
# Build-only check of the docs site on pull requests; publishing stays in pages.yml (push to main).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # Node and pnpm only; with auto-install off, a task needing any other tool fails instead of installing it.
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: node pnpm
      - run: MISE_TASK_RUN_AUTO_INSTALL=false mise run docs:build
