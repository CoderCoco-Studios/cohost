name: pages

# @spec DEPLOY-CI-003, DEPLOY-CI-012, DEPLOY-TOOL-018
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # Node and pnpm only; with auto-install off, a task needing any other tool fails instead of installing it.
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: node pnpm
      - run: MISE_TASK_RUN_AUTO_INSTALL=false mise run docs:build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
