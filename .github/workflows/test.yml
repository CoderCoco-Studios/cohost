name: test

# @spec DEPLOY-CI-001
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis lets the bus round-trip test run instead of skipping itself.
    services:
      redis:
        image: redis:8.10.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # pgvector lets the memory store's real-Postgres tests run instead of skipping themselves (DEPLOY-CI-008).
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: cohost
          POSTGRES_PASSWORD: cohost
          POSTGRES_DB: cohost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohost -d cohost_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      COHOST_TEST_DATABASE_URL: postgres://cohost:cohost@127.0.0.1:5432/cohost_test
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml names the version and components; rustup is preinstalled on the runner.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rust bus example round trip (must run, not skip)
        # REDIS_URL is set, so the test itself fails if Redis is unreachable; this also fails on a SKIP line and requires the RAN line.
        run: |
          cargo test --manifest-path examples/Cargo.toml -p cohost-example-bus -- --nocapture 2>&1 | tee round-trip.log
          ! grep -q '^SKIP ' round-trip.log
          grep -q '^RAN round_trip against ' round-trip.log
      - run: pnpm test
