name: compose-smoke

# @spec DEPLOY-CI-002, DEPLOY-CI-012
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
      - run: mise run smoke
      # The launch end-to-end test (CTRL-STACK-015): StackController.launch and stopAll on a real Compose project.
      # test:launch builds through build, the bus addon included (BUS-NAT-BLD-002).
      # @spec DEPLOY-CI-007
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local/share/mise/cargo/registry/index
            ~/.local/share/mise/cargo/registry/cache
            ~/.local/share/mise/cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'mise.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: mise run test:launch
