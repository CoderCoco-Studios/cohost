# The `@cohost/shared` workspace package is the shared-runtime segment. Its
# blocks / blockedBy follow the import graph it is designed to have (it imports
# config and bus; every service imports it). Every service has moved onto it
# (runService); the other segments' blocks / blockedBy list the segments they
# were designed against and do not repeat shared-runtime, which all of them use.
# module-contract's edges follow the segments that implement it.
# Bus-event coupling between services is not encoded here; see each LLD's
# References section.
