# NVIDIA GPU overlay. Works on native Linux (nvidia-container-toolkit) and on
# Docker Desktop / docker-ce inside WSL2 (driver lives on the Windows side).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# install.sh sets COMPOSE_FILE in .env so you can just run `docker compose up -d`.

x-gpu: &gpu  # @spec DEPLOY-COMPOSE-010
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    <<: *gpu
  tts:  # @spec DEPLOY-ENG-017
    <<: *gpu
    # The CUDA 12.8 build: the Kokoro-FastAPI amd64 GPU build with kernels for RTX 50-series (Blackwell, sm_120) cards,
    # on which the CUDA 12.6 build (plain v0.10.0 / v0.10.0-cu126) crash-loops. It needs a CUDA 12.8 driver (R570+).
    # Tag looked up in ghcr.io on 2026-11-26 (newest release v0.10.0; the same image index as the floating cu128 tag).
    # A card or driver it does not run on: set KOKORO_IMAGE=ghcr.io/remsky/kokoro-fastapi-gpu:v0.10.0-cu126 in .env.
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:v0.10.0-cu128}
  stt:
    <<: *gpu
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cuda}
  stt-nemotron:  # @spec DEPLOY-ENG-010
    <<: *gpu
  stt-kyutai:
    <<: *gpu
