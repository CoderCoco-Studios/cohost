name: cla

# @spec DEPLOY-CI-005
# Every contributor to a pull request must have signed CLA.md. pull_request_target and issue_comment run this
# workflow, and the checkout below, from the base repository's own commit (github.sha), so the script that holds
# the write token is already merged code: a pull request cannot change what runs here, and its code is never
# checked out, built or run. The workflow runs only while the repository's Actions policy allows
# pull_request_target for cla.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write # re-runs the pull request's failed cla run once everyone has signed
  contents: write # writes .github/cla/signatures.json on the cla-signatures branch
  pull-requests: write # the check's comment and the lock after merge

# One run per pull request at a time and none cancelled, so a signing comment is never lost to a newer event.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # The job's name is the pull request's check name: cla.
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: node
      - run: MISE_TASK_RUN_AUTO_INSTALL=false mise run cla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
