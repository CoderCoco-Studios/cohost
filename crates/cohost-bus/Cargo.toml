[package]
name = "cohost-bus"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.8.1", features = ["tokio-comp", "aio", "streams"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }

[dev-dependencies]
base64 = "0.23.1"
uuid = { version = "1.29.2", features = ["v4"] }
